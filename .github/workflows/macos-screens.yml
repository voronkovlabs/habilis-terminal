name: macos-screens

# Screenshots from a macOS runner (issue #258): the app and its tests build there (the portable build, #259), the
# tests run, and a small Avalonia probe window and Habilis itself are started and photographed (#253).
on:
  push:
    branches: [main, experiment/avalonia]
    paths: ['tools/MacProbe/**', 'src/**', 'tests/**', 'Directory.Build.props', '.github/workflows/macos-screens.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screens:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: System
        run: sw_vers; uname -m; system_profiler SPDisplaysDataType | sed -n '1,30p'
      - name: Build the app and the tests
        # Not the whole solution: tools/IconBuilder is a WPF tool.
        run: |
          set -e
          dotnet build src/HabilisTerminal.App -c Release
          for t in tests/HabilisTerminal.*.Tests; do dotnet build "$t" -c Release; done
      - name: Portable tests
        run: |
          dotnet test --project tests/HabilisTerminal.Terminal.Tests -c Release --no-build
          dotnet test --project tests/HabilisTerminal.Themes.Tests -c Release --no-build
          dotnet test --project tests/HabilisTerminal.Core.Tests -c Release --no-build
          dotnet test --project tests/HabilisTerminal.App.Tests -c Release --no-build
      - name: Console tests (pty and zsh, #268)
        run: |
          set -o pipefail
          dotnet test --project tests/HabilisTerminal.Shell.Tests -c Release --no-build 2>&1 | tee tests-Shell.log
      - name: Build the probe
        if: always()
        run: dotnet build tools/MacProbe -c Release -o probe
      - name: Start, type, photograph
        if: always()
        run: |
          mkdir -p screens
          screencapture -x screens/1-desktop.png
          ./probe/MacProbe > probe.log 2>&1 &
          sleep 15
          osascript -e 'tell application "System Events" to set frontmost of (first process whose unix id is '"$!"') to true' || true
          sleep 2
          screencapture -x screens/2-probe-window.png
          osascript -e 'tell application "System Events" to keystroke "Hello from a Mac runner, привет"' || echo "keystroke failed"
          sleep 2
          screencapture -x screens/3-after-typing.png
          # The emulator's screen from the terminal tests' point of view, next to the window: the runner's own Terminal app.
          open -a Terminal "$PWD" || true
          sleep 5
          screencapture -x screens/4-terminal-app.png
          kill %1 || true
          cat probe.log
      - name: Start Habilis
        if: always()
        run: |
          osascript -e 'quit app "Terminal"' || true
          # The runner's login shell is bash; a Mac's is zsh, which has the integration (#268).
          SHELL=/bin/zsh ./src/HabilisTerminal.App/bin/Release/net10.0/habi > habi.log 2>&1 &
          pid=$!
          sleep 25
          if kill -0 $pid 2>/dev/null; then echo "habi is running"; else echo "habi has ended"; fi
          osascript -e 'tell application "System Events" to set frontmost of (first process whose unix id is '"$pid"') to true' || true
          sleep 2
          screencapture -x screens/5-habilis.png
          # Keys go to the window in front: three rows down, then the F9 menu (key codes: Down 125, F9 101, Esc 53).
          osascript -e 'tell application "System Events" to repeat 3 times' -e 'key code 125' -e 'end repeat' || true
          sleep 1
          screencapture -x screens/6-habilis-cursor.png
          osascript -e 'tell application "System Events" to key code 101' || true
          sleep 2
          screencapture -x screens/7-habilis-f9.png
          osascript -e 'tell application "System Events" to key code 53' || true
          sleep 1
          # The drive menu (Alt+F1: option and key code 122) has codicons: do they draw on a Mac (#261)?
          osascript -e 'tell application "System Events" to key code 122 using option down' || true
          sleep 2
          screencapture -x screens/7b-habilis-drives.png
          osascript -e 'tell application "System Events" to key code 53' || true
          sleep 1
          # The Mac's menu bar (#273): the app menu, then our Files menu.
          osascript -e 'tell application "System Events" to tell (first process whose unix id is '"$pid"') to click menu bar item 1 of menu bar 1' || true
          sleep 1
          screencapture -x screens/7c-habilis-app-menu.png
          osascript -e 'tell application "System Events" to key code 53' || true
          osascript -e 'tell application "System Events" to tell (first process whose unix id is '"$pid"') to click menu bar item "Files" of menu bar 1' || true
          sleep 1
          screencapture -x screens/7d-habilis-files-menu.png
          osascript -e 'tell application "System Events" to key code 53' || true
          sleep 1
          # The console (#268): typed text goes to zsh's command line, as in Far; Enter runs it; cd moves the panel.
          osascript -e 'tell application "System Events" to keystroke "echo hello from zsh $ZSH_VERSION"' || true
          osascript -e 'tell application "System Events" to key code 36' || true
          sleep 3
          screencapture -x screens/8-habilis-zsh.png
          osascript -e 'tell application "System Events" to keystroke "cd /usr/bin"' || true
          osascript -e 'tell application "System Events" to key code 36' || true
          sleep 3
          screencapture -x screens/9-habilis-cd.png
          osascript -e 'tell application "System Events" to keystroke "ls -la | head -40"' || true
          osascript -e 'tell application "System Events" to key code 36' || true
          sleep 3
          screencapture -x screens/10-habilis-ls.png
          kill $pid || true
          echo "--- habi output"; cat habi.log
          echo "--- crash reports"; find ~/Library/Application\ Support -path '*Habilis*' -name 'crash-*.json' -exec cat {} \; 2>/dev/null | head -c 20000
          echo "--- crash or trace files"; find ~/Library/Application\ Support ~/.config ~/.local/share -path '*Habilis*' -type f 2>/dev/null | head -20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-screens
          path: |
            screens/
            tests-*.log
            habi.log
