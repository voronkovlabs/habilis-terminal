name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build
      - name: Plugins
        # The standard plugins (plugins/, issue #58): built against the SDK package and tested on every push.
        shell: pwsh
        run: ./tools/plugins/Build-Plugins.ps1

  release:
    # A tag vX.Y.Z builds the installers, update packages and portable zips and publishes a GitHub release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      REPO_URL: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore tools
        run: dotnet tool restore
      - name: Package
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          New-Item -ItemType Directory -Force artifacts | Out-Null

          # The standard plugins ship in a 'plugins' folder next to habi.exe (issue #58); the test job already ran their tests.
          ./tools/plugins/Build-Plugins.ps1 -SkipTests

          # Crash and feedback reports (issues #22, #23): the token goes into the build as base64 of the reversed token,
          # so the binary holds no plain github_pat_ string. Masked in the log. Without the secret reports use the browser.
          $reportToken = ''
          if ($env:CRASH_REPORT_TOKEN) {
            $chars = $env:CRASH_REPORT_TOKEN.ToCharArray()
            [Array]::Reverse($chars)
            $reportToken = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(-join $chars))
            Write-Output "::add-mask::$reportToken"
          }
          foreach ($rid in 'win-x64', 'win-arm64') {
            $publish = "publish/$rid"
            dotnet publish src/HabilisTerminal.App -c Release -r $rid --self-contained true -p:Version=$version -p:CrashReportToken=$reportToken -o $publish
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Copy-Item artifacts/plugins "$publish/plugins" -Recurse
            # The SDK keeps its own assembly version; -p:Version must not reach it (issue #60).
            $sdkVersion = [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path "$publish/HabilisTerminal.Plugins.Sdk.dll")).Version
            if ($sdkVersion.ToString() -eq "$version.0") { throw "The plugin SDK took the app version $version." }
            # The archives plugin (issue #149) carries a 7z.dll per architecture (PE machine 0x8664 x64, 0xAA64 arm64).
            $dll = [IO.File]::ReadAllBytes((Resolve-Path "$publish/plugins/habi.archives/native/$rid/7z.dll"))
            $machine = [BitConverter]::ToUInt16($dll, [BitConverter]::ToInt32($dll, 0x3C) + 4)
            if ($machine -ne @{ 'win-x64' = 0x8664; 'win-arm64' = 0xAA64 }[$rid]) { throw "7z.dll for $rid has machine 0x$($machine.ToString('X4'))." }

            # Previous release for delta updates; the first release has none.
            dotnet vpk download github --repoUrl $env:REPO_URL --channel $rid --outputDir "releases/$rid" --token $env:GH_TOKEN
            dotnet vpk pack --packId HabilisTerminal --packVersion $version --packDir $publish --mainExe habi.exe `
              --packTitle "Habilis Terminal" --packAuthors "Sergey Voronkov" --icon src/HabilisTerminal.App/Assets/habi.ico `
              --runtime $rid --channel $rid --outputDir "releases/$rid" --noPortable
            if ($LASTEXITCODE) { exit $LASTEXITCODE }

            # Our own portable zip instead of Velopack's: the app plus the 'portable' marker (settings and state stay next to habi.exe).
            New-Item "$publish/portable" -ItemType File | Out-Null
            Compress-Archive -Path "$publish/*" -DestinationPath "artifacts/HabilisTerminal-$version-$rid-portable.zip"
          }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet vpk upload github --repoUrl $env:REPO_URL --token $env:GH_TOKEN --channel $rid --outputDir "releases/$rid" `
              --tag ${{ github.ref_name }} --releaseName "Habilis Terminal $version" --publish --merge
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          gh release upload ${{ github.ref_name }} artifacts/*.zip --clobber
      - name: Keep only the last two releases
        shell: pwsh
        # A failure here must not fail a release that is already out.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The releases go; their git tags stay, as the findings refer to them.
          $old = gh release list --limit 1000 --exclude-drafts --json tagName,publishedAt --jq 'sort_by(.publishedAt) | reverse | .[2:] | .[].tagName'
          foreach ($tag in $old) { gh release delete $tag --yes }
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            releases/*/*Setup.exe
            artifacts/*.zip
